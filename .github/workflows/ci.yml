# - lint: actionlint, shellcheck, yamllint, hadolint;
# - unit: JenkinsPipelineUnit tests (Gradle); the ssh-build deploy test runs the generated command in real bash;
# - e2e: a real Jenkins (same LTS line as jenkins-config) loads this library and runs autoPipeline() against
#   two tiny Node projects: one must pass, one with a deliberately failing test must fail.
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: pipx run yamllint==1.38.0 -c .yamllint.yml examples ci/casc.yaml .github
      - name: hadolint
        run: docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold warning - < ci/Dockerfile
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"
          ./actionlint -color
      - name: shellcheck
        run: shellcheck ci/*.sh

  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: "9.8.2"
      - name: gradle test
        run: gradle test --no-daemon

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build and start Jenkins, load the library and the fixtures
        run: ci/start-jenkins.sh
      - name: Passing project goes green
        run: |
          ci/run-scm-job.sh node-pass /var/jenkins_home/fixtures/node-pass SUCCESS "Language: node"
      - name: Project with a failing test goes red
        run: ci/run-scm-job.sh node-fail /var/jenkins_home/fixtures/node-fail FAILURE "AssertionError"
      - name: Without deploy config the deploy stage is skipped even on a deploy branch
        # node-pass runs with BRANCH_NAME=develop, so the branch condition is true and only the
        # missing deploy.target can be the reason the stage is skipped.
        run: |
          grep -F "Deploy: none" console-node-pass.txt
          grep -F "Docker: false" console-node-pass.txt
          grep -F 'Stage "Deploy Staging" skipped' console-node-pass.txt
          grep -F 'Stage "Docker Build" skipped' console-node-pass.txt
          if grep -F "Deploying to" console-node-pass.txt; then echo "unexpected match above" >&2; exit 1; fi
      - name: Deploy to staging runs on develop and only there (real ssh to the controller's sshd)
        run: |
          docker exec jenkins rm -f /tmp/e2e-deploy-staging.marker /tmp/e2e-deploy-production.marker
          ci/run-scm-job.sh node-deploy-staging /var/jenkins_home/fixtures/node-deploy-staging SUCCESS "Deploying to staging via ssh"
          if grep -F 'Stage "Deploy Staging" skipped' console-node-deploy-staging.txt; then echo "unexpected match above" >&2; exit 1; fi
          grep -F 'Stage "Deploy Production" skipped' console-node-deploy-staging.txt
          test "$(docker exec jenkins cat /tmp/e2e-deploy-staging.marker)" = staging-ran
          if docker exec jenkins test -e /tmp/e2e-deploy-production.marker; then echo "unexpected match above" >&2; exit 1; fi
      - name: Deploy to production runs on main and only there
        run: |
          ci/run-scm-job.sh node-deploy-production /var/jenkins_home/fixtures/node-deploy-production SUCCESS "Deploying to production via ssh"
          if grep -F 'Stage "Deploy Production" skipped' console-node-deploy-production.txt; then echo "unexpected match above" >&2; exit 1; fi
          grep -F 'Stage "Deploy Staging" skipped' console-node-deploy-production.txt
          test "$(docker exec jenkins cat /tmp/e2e-deploy-production.marker)" = production-ran
      - name: A failing deploy command turns the build red
        run: ci/run-scm-job.sh node-deploy-fail /var/jenkins_home/fixtures/node-deploy-fail FAILURE "about-to-fail"
      - name: Controller log on failure
        if: failure()
        run: docker logs --tail 300 jenkins
      - name: Tear down
        if: always()
        run: docker rm -f jenkins
