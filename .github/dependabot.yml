version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /ci
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Jenkins runs pipelines on Groovy 2.4; the tests must compile with the same line.
      - dependency-name: "org.codehaus.groovy:groovy-all"
        update-types: ["version-update:semver-major"]
